<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->

    <!-- FontAwesome Icons -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>

            theme: {
                extend: {
                    colors: {
                        pptBrand: '#D24726',       /* PowerPoint 經典品牌橘紅 */

                        pptAccent: '#FFF1ED'

                    fontFamily: {

    <style>
        body {
            background-color: #F9F8F6;
            color: #2C303E;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 擬真鍵盤按鍵樣式 <kbd> */
        .kbd-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.8rem;
            height: 1.8rem;
            padding: 0 0.4rem;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1E293B;
            background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
            border: 1px solid #CBD5E1;
            border-bottom: 3px solid #94A3B8;
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: all 0.15s ease;
            user-select: none;
        }

        .kbd-key:hover {
            transform: translateY(-1px);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        /* 卡片懸浮卡感 */
        .shortcut-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .shortcut-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(210, 71, 38, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        /* Modal 動畫 */
        .modal-animate {
            animation: modalFadeIn 0.2s ease-out forwards;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

            </div>

                    </button>
                    <button id="btnOSMac" onclick="setOS('mac')" class="px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 text-gray-500 hover:text-pptNavy">
                        <i class="fa-brands fa-apple text-gray-700"></i>
                        <span>Mac</span>
                    </button>
                </div>

                <!-- 記憶大考驗測驗 Modal 開啟按鈕 -->

                    <i class="fa-solid fa-gamepad"></i>
                    <span class="hidden sm:inline">快捷鍵</span>大考驗
                </button>
            </div>
        </div>
    </header>

    <!-- 2. 主內容區域 Main Section -->

            <div class="relative z-10 max-w-3xl space-y-4">
                <div class="space-y-1">
                    <h2 class="text-xl sm:text-2xl font-bold flex items-center gap-2">

                    </h2>
                    <p class="text-xs sm:text-sm text-gray-300">輸入功能（例如：播放、字體、群組、貼上）或按鍵（例如：F5、Ctrl、B）</p>
                </div>

                <!-- 搜尋輸入框 -->

                    <button onclick="quickSearch('黑屏')" class="bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded-md transition-colors">播放黑屏 (B)</button>

            </div>

                id: 'o3',
                category: '物件與對齊',
                title: '複製物件並平行/垂直移動',
                desc: '按住 Ctrl + Shift 並拖曳物件，可以垂直或水平等距離複製該物件。',
                keysWin: ['Ctrl', 'Shift', '拖曳'],
                keysMac: ['Cmd ⌘', 'Shift ⇧', '拖曳'],
                tags: ['對齊拖曳', '平行複製', '等比']
            },
            {
                id: 'o4',
                category: '物件與對齊',
                title: '將物件移至最上層',
                desc: '將選取的圖形或圖片移至所有重疊物件的最頂層。',
                keysWin: ['Ctrl', 'Shift', ']'],
                keysMac: ['Cmd ⌘', 'Shift ⇧', 'F'],
                tags: ['圖層', '最上層', '頂層']
            },
            {
                id: 'o5',
                category: '物件與對齊',
                title: '將物件移至最下層',
                desc: '將選取的圖形或圖片移至所有重疊物件的最底層。',
                keysWin: ['Ctrl', 'Shift', '['],
                keysMac: ['Cmd ⌘', 'Shift ⇧', 'B'],
                tags: ['圖層', '最下層', '底層']
            },

            // --- 視圖與介面 (View & Zoom) ---
            {
                id: 'v1',
                category: '視圖與介面',
                title: '顯示 / 隱藏網格線',
                desc: '在畫面上開啟對齊用網格線，協助精確排版與元件對齊。',
                keysWin: ['Shift', 'F9'],
                keysMac: ['Shift ⇧', 'F9'],
                tags: ['網格', '對齊', '輔助線']
            },
            {
                id: 'v2',
                category: '視圖與介面',
                title: '顯示 / 隱藏參考線',
                desc: '切換畫面的十字輔助參考線。',
                keysWin: ['Alt', 'F9'],
                keysMac: ['Option ⌥', 'F9'],
                tags: ['參考線', '排版', '標尺']
            },
            {
                id: 'v3',
                category: '視圖與介面',
                title: '快速展開 / 隱藏 功能區 (Ribbon)',
                desc: '收合上方工具列功能區，以釋放出更大的投影片編輯視野。',
                keysWin: ['Ctrl', 'F1'],
                keysMac: ['Cmd ⌘', 'Option ⌥', 'R'],
                tags: ['工具列', '隱藏', '全螢幕']
            },

            // --- 常用基礎 (General & Basics) ---
            {
                id: 'g1',
                category: '常用基礎',
                title: '復原上一動作 (Undo)',
                desc: '撤銷剛才的操作步驟。',
                keysWin: ['Ctrl', 'Z'],
                keysMac: ['Cmd ⌘', 'Z'],
                tags: ['復原', '撤銷', '上一步']
            },
            {
                id: 'g2',
                category: '常用基礎',
                title: '重做 / 重複上一動作 (Redo)',
                desc: '重新執行剛才復原的操作，或是重複上一動作（如重複複製）。',
                keysWin: ['Ctrl', 'Y'],
                keysMac: ['Cmd ⌘', 'Y'],
                tags: ['重做', '重複']
            },
            {
                id: 'g3',
                category: '常用基礎',
                title: '插入超連結',
                desc: '為選取的文字、按鈕或圖形快速加入網頁連結或跳頁連結。',
                keysWin: ['Ctrl', 'K'],
                keysMac: ['Cmd ⌘', 'K'],
                tags: ['連結', '網址', '超連結']
            },
            {
                id: 'g4',
                category: '常用基礎',
                title: '儲存檔案 (Save)',
                desc: '隨時儲存目前的簡報編輯進度。',
                keysWin: ['Ctrl', 'S'],
                keysMac: ['Cmd ⌘', 'S'],
                tags: ['存檔', '儲存']
            }
        ];

        // ==========================================
        // 2. 狀態管理 (State Management)
        // ==========================================
        let currentOS = 'win'; // 'win' 或 'mac'
        let currentCategory = '全選';
        let searchQuery = '';
        let showFavOnly = false;
        let favoriteIds = JSON.parse(localStorage.getItem('power_shortcut_favs') || '[]');

        // 分類清單
        const categories = ['全選', '簡報播放', '投影片編輯', '文字與格式', '物件與對齊', '視圖與介面', '常用基礎'];

        // ==========================================
        // 3. UI 渲染邏輯 (UI Rendering Functions)
        // ==========================================
        
        // 渲染分類 Tabs
        function renderCategories() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = categories.map(cat => {
                const isActive = (currentCategory === cat);
                const activeClass = isActive 
                    ? 'bg-pptBrand text-white shadow-md font-bold' 
                    : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200';
                return `
                    <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl transition-all whitespace-nowrap ${activeClass}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        // 渲染快捷鍵卡片列表
        function renderShortcuts() {
            const grid = document.getElementById('shortcutsGrid');
            const emptyState = document.getElementById('emptyState');

            // 廣義過濾
            const filtered = shortcutsData.filter(item => {
                // 分類過濾
                if (currentCategory !== '全選' && item.category !== currentCategory) return false;

                // 我的最愛過濾
                if (showFavOnly && !favoriteIds.includes(item.id)) return false;

                // 搜尋過濾
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const matchTitle = item.title.toLowerCase().includes(q);
                    const matchDesc = item.desc.toLowerCase().includes(q);
                    const matchTags = item.tags.some(t => t.toLowerCase().includes(q));
                    const keys = (currentOS === 'win' ? item.keysWin : item.keysMac).join(' ').toLowerCase();
                    const matchKeys = keys.includes(q);

                    return matchTitle || matchDesc || matchTags || matchKeys;
                }

                return true;
            });

            // 更新總筆數與最愛計數
            document.getElementById('totalCount').textContent = filtered.length;
            document.getElementById('favCountBadge').textContent = favoriteIds.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            // 生成卡片 HTML
            grid.innerHTML = filtered.map(item => {
                const isFav = favoriteIds.includes(item.id);
                const keysList = currentOS === 'win' ? item.keysWin : item.keysMac;

                // 產生擬真鍵盤標籤
                const keysHtml = keysList.map((k, idx) => {
                    if (k === '+' || k === '拖曳') {
                        return `<span class="text-xs font-bold text-gray-400 mx-0.5">${k}</span>`;
                    }
                    return `<kbd class="kbd-key">${k}</kbd>`;
                }).join('');

                return `
                    <div class="shortcut-card bg-white rounded-2xl p-5 border border-gray-200/80 flex flex-col justify-between space-y-4 relative group shadow-sm">
                        <div class="space-y-2">
                            <!-- 頂部標籤與最愛星號 -->
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[11px] font-bold text-pptBrand bg-pptAccent px-2.5 py-0.5 rounded-full border border-pptBrand/15">
                                    ${item.category}
                                </span>
                                <button onclick="toggleFavorite('${item.id}', event)" class="text-gray-300 hover:text-amber-400 transition-colors p-1" title="${isFav ? '移除收藏' : '加入收藏'}">
                                    <i class="fa-${isFav ? 'solid' : 'regular'} fa-star ${isFav ? 'text-amber-400' : ''} text-base"></i>
                                </button>
                            </div>

                            <!-- 標題與描述 -->
                            <h3 class="font-bold text-pptNavy text-base group-hover:text-pptBrand transition-colors">
                                ${item.title}
                            </h3>
                            <p class="text-xs text-gray-500 leading-relaxed line-clamp-2">
                                ${item.desc}
                            </p>
                        </div>

                        <!-- 底部按鍵與複製功能 -->
                        <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
                            <div class="flex items-center flex-wrap gap-1">
                                ${keysHtml}
                            </div>
                            
                            <button onclick="copyShortcut('${item.title}', '${keysList.join(' + ')}') " class="shrink-0 bg-gray-50 hover:bg-pptBrand hover:text-white text-gray-600 text-xs py-1.5 px-2.5 rounded-lg border border-gray-200 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i>
                                <span class="hidden sm:inline">複製</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 4. 互動事件處裡 (Event Handlers)
        // ==========================================

        // 切換作業系統
        function setOS(os) {
            currentOS = os;
            const btnWin = document.getElementById('btnOSWin');
            const btnMac = document.getElementById('btnOSMac');

            if (os === 'win') {
                btnWin.className = 'px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 bg-white text-pptNavy shadow-sm font-bold';
                btnMac.className = 'px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 text-gray-500 hover:text-pptNavy';
            } else {
                btnMac.className = 'px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 bg-white text-pptNavy shadow-sm font-bold';
                btnWin.className = 'px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 text-gray-500 hover:text-pptNavy';
            }
            renderShortcuts();
        }

        // 切換分類
        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderShortcuts();
        }

        // 關鍵字搜尋輸入
        function handleSearch() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value;
            const btnClear = document.getElementById('btnClearSearch');
            
            if (searchQuery.length > 0) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
            }
            renderShortcuts();
        }

        // 熱門標籤快速搜尋
        function quickSearch(term) {
            const input = document.getElementById('searchInput');
            input.value = term;
            handleSearch();
        }

        // 清除搜尋
        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            handleSearch();
        }

        // 切換最愛收藏狀態
        function toggleFavorite(id, e) {
            if (e) e.stopPropagation();
            if (favoriteIds.includes(id)) {
                favoriteIds = favoriteIds.filter(fId => fId !== id);
            } else {
                favoriteIds.push(id);
            }
            localStorage.setItem('power_shortcut_favs', JSON.stringify(favoriteIds));
            renderShortcuts();
        }

        // 切換「只看最愛」模式
        function toggleFavOnly() {
            showFavOnly = !showFavOnly;
            const btn = document.getElementById('btnFavOnly');
            if (showFavOnly) {
                btn.classList.add('bg-amber-50', 'border-amber-300', 'text-amber-800', 'font-bold');
            } else {
                btn.classList.remove('bg-amber-50', 'border-amber-300', 'text-amber-800', 'font-bold');
            }
            renderShortcuts();
        }

        // 重設篩選
        function resetFilters() {
            currentCategory = '全選';
            searchQuery = '';
            showFavOnly = false;
            document.getElementById('searchInput').value = '';
            document.getElementById('btnClearSearch').classList.add('hidden');
            document.getElementById('btnFavOnly').classList.remove('bg-amber-50', 'border-amber-300', 'text-amber-800', 'font-bold');
            renderCategories();
            renderShortcuts();
        }

        // 複製快捷鍵內容
        function copyShortcut(title, keysStr) {
            const textToCopy = `[Power 快捷鍵] ${title}: ${keysStr} (${currentOS === 'win' ? 'Windows' : 'Mac'})`;
            
            // 使用內建跨瀏覽器複製語法
            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast(`已複製: ${title} (${keysStr})`);
            } catch (err) {
                showToast('複製失敗，請手動複製');
            }
            document.body.removeChild(tempInput);
        }

        // 顯示 Toast 訊息
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // ==========================================
        // 5. 快捷鍵測驗模式 (Quiz / Flashcard Mode)
        // ==========================================
        let quizCurrentIndex = 0;
        let quizScore = 0;
        let quizQuestions = [];

        function openQuizModal() {
            // 隨機抽選 5 題測驗題目
            quizQuestions = [...shortcutsData].sort(() => 0.5 - Math.random()).slice(0, 5);
            quizCurrentIndex = 0;
            quizScore = 0;
            
            document.getElementById('quizModal').classList.remove('hidden');
            renderQuizQuestion();
        }

        function closeQuizModal() {
            document.getElementById('quizModal').classList.add('hidden');
        }

        function renderQuizQuestion() {
            const container = document.getElementById('quizContent');

            if (quizCurrentIndex >= quizQuestions.length) {
                // 測驗結束畫面
                container.innerHTML = `
                    <div class="text-center py-6 space-y-4">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 mx-auto flex items-center justify-center text-3xl font-bold">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <div class="space-y-1">
                            <h4 class="text-xl font-bold text-pptNavy">測驗完成！</h4>
                            <p class="text-sm text-gray-500">您的答對成績為：<span class="text-pptBrand font-bold text-lg">${quizScore} / ${quizQuestions.length}</span></p>
                        </div>
                        <p class="text-xs text-gray-400">熟能生巧，多加練習簡報製作速度倍增！</p>
                        <button onclick="openQuizModal()" class="w-full bg-pptBrand hover:bg-pptHover text-white font-bold py-3 rounded-xl shadow-md transition-all">
                            再次挑戰
                        </button>
                    </div>
                `;
                return;
            }

            const q = quizQuestions[quizCurrentIndex];
            const correctKeys = (currentOS === 'win' ? q.keysWin : q.keysMac).join(' + ');

            // 生成干擾選項 (3 個錯誤 + 1 個正確)
            let wrongOptions = shortcutsData
                .filter(item => item.id !== q.id)
                .map(item => (currentOS === 'win' ? item.keysWin : item.keysMac).join(' + '));
            
            // 去重
            wrongOptions = [...new Set(wrongOptions)].sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [...wrongOptions, correctKeys].sort(() => 0.5 - Math.random());

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between text-xs text-gray-400">
                        <span>題目 ${quizCurrentIndex + 1} / ${quizQuestions.length}</span>
                        <span>系統：${currentOS === 'win' ? 'Windows' : 'Mac'}</span>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-center space-y-1">
                        <span class="text-[10px] text-pptBrand font-bold bg-pptAccent px-2 py-0.5 rounded-full">${q.category}</span>
                        <h4 class="text-base sm:text-lg font-bold text-pptNavy">${q.title}</h4>
                        <p class="text-xs text-gray-500">${q.desc}</p>
                    </div>

                    <div class="grid grid-cols-1 gap-2 pt-2">
                        ${options.map(opt => `
                            <button onclick="checkQuizAnswer('${opt.replace(/'/g, "\\'")}', '${correctKeys.replace(/'/g, "\\'")}')" class="w-full text-left p-3.5 rounded-xl border border-gray-200 hover:border-pptBrand hover:bg-pptAccent/50 transition-all font-mono text-sm text-pptNavy font-bold flex items-center justify-between group">
                                <span><i class="fa-regular fa-keyboard text-gray-400 mr-2 group-hover:text-pptBrand"></i>${opt}</span>
                                <i class="fa-solid fa-chevron-right text-xs text-gray-300 group-hover:text-pptBrand"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(selected, correct) {
            if (selected === correct) {
                quizScore++;
                showToast('答對了！太厲害了！');
            } else {
                showToast(`可惜答錯了！正確答案是：${correct}`);
            }
            quizCurrentIndex++;
            setTimeout(renderQuizQuestion, 600);
        }

        // ==========================================
        // 6. 初始化執行 (Page Load Initialization)
        // ==========================================
        window.onload = function() {
            renderCategories();
            renderShortcuts();
        };
    </script>
</body>
</html>
